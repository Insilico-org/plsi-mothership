[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "plsi-mother"
dynamic = ["version"]
description = "The Longevity Mothership toolbelt: relay intake, research notes, feedback, releases, catalog and findings."
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
drive = ["google-api-python-client", "google-auth"]

[project.scripts]
mother = "mother.cli:main"

[tool.setuptools.dynamic]
version = {attr = "mother.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
